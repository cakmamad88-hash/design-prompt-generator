<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Prompt Generator Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f3f4f6; min-height: 100vh; padding: 40px 16px; color: #1f2937; }
        .hidden { display: none !important; }
        
        /* Gradient & Card */
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .card { max-width: 768px; margin: 0 auto; background: white; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); overflow: hidden; }
        
        /* Login Overlay */
        .overlay { position: fixed; inset: 0; background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
        .login-box { background: white; border-radius: 24px; max-width: 400px; width: 100%; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .login-header { padding: 24px; text-align: center; }
        .login-header h2 { font-size: 24px; font-weight: 700; }
        .login-header p { font-size: 13px; color: #e0e7ff; margin-top: 4px; }
        .login-body { padding: 24px; }

        /* Header Utama */
        .main-header { padding: 32px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
        .main-header h1 { font-size: 28px; font-weight: 700; }
        .main-header p { color: #e0e7ff; margin-top: 6px; font-size: 15px; }
        .btn-lock { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 12px; font-weight: 600; font-size: 12px; cursor: pointer; }
        .btn-lock:hover { background: rgba(255,255,255,0.3); }

        /* Form Layout */
        .form-body { padding: 32px; display: flex; flex-direction: column; gap: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .flex-gap { display: flex; gap: 10px; }
        .flex-1 { flex: 1; }
        label { display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 8px; }
        input[type="text"], input[type="number"], input[type="password"], select, textarea {
            width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 14px; outline: none; transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        .col-full { grid-column: 1 / -1; }

        /* Opsi Tambahan Box */
        .ai-box { background: #eef2ff; padding: 20px; border-radius: 16px; border: 1px solid #e0e7ff; }
        .ai-box h2 { font-size: 12px; font-weight: 700; color: #312e81; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
        .switch-row { display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #374151; }

        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 48px; height: 24px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #ccc; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #4f46e5; }
        input:checked + .slider:before { transform: translateX(24px); }

        /* Buttons */
        .btn-primary { width: 100%; background: #4f46e5; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background: #4338ca; }
        .btn-copy { width: 100%; background: #22c55e; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px; }
        .btn-copy:hover { background: #16a34a; }

        /* Output & Error */
        .result-box { background: #f3f4f6; padding: 16px; border-radius: 12px; border: 1px solid #e5e7eb; font-size: 14px; font-style: italic; white-space: pre-line; line-height: 1.5; }
        .error-text { color: #ef4444; font-size: 13px; margin-top: 8px; }

        @media (max-width: 640px) {
            .grid-2 { grid-template-columns: 1fr; }
            .main-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <!-- LAYAR KUNCI PASSWORD -->
    <div id="loginOverlay" class="overlay">
        <div class="login-box">
            <div class="gradient-bg login-header">
                <h2>Akses Terbatas</h2>
                <p>Masukkan password untuk menggunakan generator</p>
            </div>
            <form onsubmit="checkPassword(event)" class="login-body">
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" placeholder="Masukkan password..." required>
                <p id="errorMsg" class="error-text hidden">Password salah. Silakan coba lagi.</p>
                <button type="submit" class="btn-primary" style="margin-top: 16px;">Masuk</button>
            </form>
        </div>
    </div>

    <!-- KONTEN UTAMA WEBSITE -->
    <div id="mainApp" class="card hidden">
        <div class="gradient-bg main-header">
            <div>
                <h1>Design Prompt Generator</h1>
                <p>Buat instruksi desain AI lengkap dengan kustomisasi penuh.</p>
            </div>
            <button onclick="logout()" class="btn-lock">Kunci</button>
        </div>

        <div class="form-body">
            <div class="grid-2">
                <div>
                    <label>Tipe Desain</label>
                    <select id="type">
                        <option value="Brosur">Brosur</option>
                        <option value="Banner">Banner</option>
                        <option value="Stiker">Stiker</option>
                        <option value="Pamflet">Pamflet</option>
                    </select>
                </div>
                <div class="flex-gap">
                    <div class="flex-1">
                        <label>Lebar (cm)</label>
                        <input type="number" id="width" value="21">
                    </div>
                    <div class="flex-1">
                        <label>Tinggi (cm)</label>
                        <input type="number" id="height" value="29.7">
                    </div>
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label>Gaya Visual</label>
                    <select id="style">
                        <option value="minimalist and modern">Minimalis & Modern</option>
                        <option value="elegant and luxury">Elegan & Mewah</option>
                        <option value="bold and crowded with vibrant elements">Ramai & Bersemangat</option>
                        <option value="professional and corporate">Profesional & Korporat</option>
                    </select>
                </div>
                <div>
                    <label>Tema Warna</label>
                    <input type="text" id="color" placeholder="Contoh: Biru Muda dan Putih">
                </div>
            </div>

            <div class="ai-box">
                <h2>Opsi Tambahan AI</h2>
                <div class="grid-2">
                    <div class="switch-row">
                        <span>Boleh Tambahkan Teks Lain (AI)</span>
                        <label class="switch">
                            <input type="checkbox" id="aiAllowText">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="switch-row">
                        <span>Boleh Tambahkan Foto Lain (AI)</span>
                        <label class="switch">
                            <input type="checkbox" id="aiAllowPhoto">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="grid-2">
                <input type="text" id="mainText" placeholder="Teks Utama...">
                <input type="text" id="tagline" placeholder="Tagline...">
                <input type="text" id="wa" placeholder="Nomor WhatsApp...">
                <input type="text" id="photoDescription" placeholder="Deskripsi Foto Utama...">
                <input type="text" id="additionalPhoto" placeholder="Deskripsi Foto Tambahan..." class="col-full">
            </div>

            <textarea id="listItems" placeholder="Daftar Tambahan (pisahkan dengan koma)..." rows="2"></textarea>
            <textarea id="extraText" placeholder="Teks Tambahan / Catatan..." rows="2"></textarea>

            <button onclick="generatePrompt()" class="btn-primary">Generate Prompt</button>

            <div id="outputArea" class="hidden">
                <label>Prompt Hasil:</label>
                <div class="result-box" id="promptResult"></div>
                <button onclick="copyPrompt()" id="copyBtn" class="btn-copy">Salin Prompt</button>
            </div>
        </div>
    </div>

    <script>
        // GANTI PASSWORD DI BARIS BERIKUT:
        const PASSWORD_BENAR = "admin123";

        window.onload = function() {
            if (sessionStorage.getItem("isLoggedIn") === "true") {
                unlockApp();
            }
        };

        function checkPassword(event) {
            event.preventDefault();
